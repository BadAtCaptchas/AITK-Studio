name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: UI typecheck, tests, and build
    runs-on: ubuntu-latest
    env:
      AITK_SQLITE_PATH: ${{ github.workspace }}/.tmp/aitk-ci.db
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Prepare isolated CI database
        run: npm run update_db

      - name: Run UI quality gates
        run: npm run ci

  python-syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile tracked Python packages
        run: python -m compileall -q run.py toolkit extensions extensions_built_in scripts tests
